<body>
<main id="app"></main>
<script>
/*
  THROWAWAY PROTOTYPE QUESTION
  Does a revised Dense Command Deck preserve the fast workset flow while combining
  policy-constrained Sync resolutions, repository and live paths, Primary and
  canonical Additional Source Changes, standing convergence Approval, Editor-driven
  invalidation, batch actions, compact confirmation, and two-stage execution?

  This is an in-memory interaction prototype. It never reads or writes real files.
*/

// Portable state module: pure state transitions, no DOM or rendering knowledge.
const SyncDeckLogic = (() => {
  const clone = (value) => structuredClone(value);
  const intentLabel = (intent) => ({ repo: "Use repository", live: "Use live", merge: "Merge" }[intent] || "No route");
  const changed = (source) => source.current !== source.frozen;
  const proposalById = (state, id) => state.proposals.find((proposal) => proposal.id === id);

  function currentAdditionalInputs(state, proposal) {
    return proposal.additionalIds
      .map((id) => state.additional[id])
      .filter((source) => source && source.approved && changed(source))
      .map((source) => source.path);
  }

  function materialize(state, proposal, reason = "Materialized") {
    if (!proposal || proposal.blocked) return false;

    const includedAdditional = currentAdditionalInputs(state, proposal);
    const outcome = proposal.outcomes[proposal.intent];
    const repositoryOutcome = proposal.editedPrimary ?? outcome.repository;
    const liveOutcome = proposal.effectivePolicy === "push-only-delete"
      ? "(missing)"
      : proposal.intent === "repo" && proposal.editedPrimary !== null && proposal.effectivePolicy !== "pull-only"
        ? proposal.editedPrimary
        : outcome.live;

    proposal.materialized = true;
    proposal.materialization += 1;
    proposal.includedAdditional = includedAdditional;
    proposal.repositoryOutcome = repositoryOutcome;
    proposal.liveOutcome = liveOutcome;
    proposal.primaryEffect = repositoryOutcome === proposal.repositoryFrozen ? "none" : proposal.repositoryFrozen === "(missing)" ? "create" : repositoryOutcome === "(missing)" ? "delete" : "update";
    proposal.liveEffect = liveOutcome === proposal.liveFrozen ? "none" : proposal.liveFrozen === "(missing)" ? "create" : liveOutcome === "(missing)" ? "delete" : "update";
    proposal.invalidReason = null;
    proposal.lastMaterialization = `${reason}; ${includedAdditional.length ? "included approved Additional candidates" : "used frozen Additional preimages"}.`;
    return true;
  }

  function alignReferencingProposals(state, sourceId, reason, currentProposalId = null) {
    const source = state.additional[sourceId];
    if (!source) return { eager: [], lazy: [] };
    const eager = [], lazy = [];
    source.references.forEach((proposalId) => {
      const proposal = proposalById(state, proposalId);
      if (!proposal || proposal.blocked) return;
      if (proposalId === currentProposalId || proposal.approved) {
        materialize(state, proposal, reason);
        eager.push(proposal.label);
      } else {
        proposal.materialized = false;
        proposal.invalidReason = reason;
        proposal.includedAdditional = [];
        lazy.push(proposal.label);
      }
    });
    return { eager, lazy };
  }

  function approvalSummary(state) {
    return {
      proposals: state.proposals.filter((proposal) => proposal.approved).length,
      additional: Object.values(state.additional).filter((source) => changed(source) && source.approved).length,
    };
  }

  function freezeExecution(state) {
    state.proposals.filter((proposal) => proposal.approved).forEach((proposal) => {
      if (!proposal.materialized) materialize(state, proposal, "Final materialization");
    });
    const approvedProposals = state.proposals.filter((proposal) => proposal.approved && proposal.materialized && !proposal.blocked);
    const approvedAdditional = Object.values(state.additional)
      .filter((source) => changed(source) && source.approved)
      .sort((a, b) => a.path.localeCompare(b.path));
    const repositoryChanges = approvedAdditional.length + approvedProposals.filter((proposal) => proposal.primaryEffect !== "none").length;
    const liveWrites = approvedProposals.filter((proposal) => proposal.liveEffect === "create" || proposal.liveEffect === "update").length;
    const liveDeletes = approvedProposals.filter((proposal) => proposal.liveEffect === "delete").length;
    state.frozenExecution = {
      approvedProposalIds: approvedProposals.map((proposal) => proposal.id),
      approvedAdditionalIds: approvedAdditional.map((source) => source.id),
      repositoryChanges,
      liveWrites,
      liveDeletes,
      auxiliary: state.auxiliary.filter((item) => item.selected).map((item) => item.id),
    };
  }

  function buildExecutionReport(state) {
    const frozen = state.frozenExecution;
    const proposals = frozen.approvedProposalIds.map((id) => proposalById(state, id));
    const additions = frozen.approvedAdditionalIds.map((id) => state.additional[id]);
    const repositoryLines = ["Repository Apply · pull hook family"];
    const hasOwnedRepositoryWork = proposals.some((proposal) => proposal.primaryEffect !== "none");
    if (hasOwnedRepositoryWork) repositoryLines.push("pre-pull hooks · retained repository/package/target scopes");
    additions.forEach((source) => repositoryLines.push(`Additional once · ${source.repo}:${source.path}`));

    proposals.forEach((proposal) => {
      if (proposal.primaryEffect !== "none") repositoryLines.push(`Primary ${proposal.primaryEffect} · ${proposal.primaryPath}`);
      if (proposal.liveEffect === "none") {
        repositoryLines.push(proposal.baseEligible
          ? `Acknowledge Sync Base · ${proposal.label}`
          : `Complete without Sync Base · ${proposal.label}`);
        repositoryLines.push(`Converged · ${proposal.label}`);
      }
    });

    if (hasOwnedRepositoryWork) repositoryLines.push("post-pull hooks · successful retained scopes");

    const publicationLines = ["Live Publication · push hook family"];
    const selectedAuxiliary = state.auxiliary.filter((item) => frozen.auxiliary.includes(item.id));
    const needsLiveMutation = proposals.some((proposal) => proposal.liveEffect !== "none") || selectedAuxiliary.some((item) => item.kind === "root");
    selectedAuxiliary.filter((item) => item.kind === "probe").forEach((item) => {
      publicationLines.push(`Selected Probe Work retains ${item.hooks} · ${item.label}`);
    });
    if (needsLiveMutation || selectedAuxiliary.some((item) => item.kind === "probe")) publicationLines.push("pre-push hooks · retained scopes");
    if (needsLiveMutation) publicationLines.push("Snapshot frozen live publication paths before first mutation");
    selectedAuxiliary.filter((item) => item.kind === "root").forEach((item) => {
      publicationLines.push(`Directory Root Work · ${item.effect}`);
    });
    proposals.forEach((proposal) => {
      if (proposal.liveEffect === "none") return;
      publicationLines.push(`Live ${proposal.liveEffect} · ${proposal.livePath}`);
      publicationLines.push(proposal.baseEligible
        ? `Acknowledge Sync Base · ${proposal.label}`
        : `Complete without Sync Base · ${proposal.label}`);
      publicationLines.push(`Converged · ${proposal.label}`);
    });
    if (needsLiveMutation || selectedAuxiliary.some((item) => item.kind === "probe")) publicationLines.push("post-push hooks · successful retained scopes");

    const pending = [
      ...state.proposals.filter((proposal) => !proposal.approved && !proposal.blocked).map((proposal) => `Proposal · ${proposal.label}`),
      ...Object.values(state.additional).filter((source) => changed(source) && !source.approved).map((source) => `Additional · ${source.repo}:${source.path}`),
    ];
    const blocked = state.proposals.filter((proposal) => proposal.blocked).map((proposal) => proposal.label);
    state.executionReport = {
      repositoryLines,
      publicationLines,
      pending,
      blocked,
      status: blocked.length ? "Approved work converged; one Guard-blocked unit remains (exit 1)." : "Approved work converged (exit 0).",
    };
  }

  function dispatch(input, action) {
    const state = clone(input);
    if (state.sessionEnded && action.type !== "RESET") return state;

    switch (action.type) {
      case "RESET":
        return clone(action.state);
      case "FOCUS":
        state.focus = action.focus;
        state.lastAction = `Focused ${action.label}.`;
        break;
      case "OPEN_PROPOSAL": {
        const proposal = proposalById(state, action.id);
        if (!proposal) break;
        if (!proposal.materialized && !proposal.blocked) materialize(state, proposal, "Review materialization");
        state.view = "proposal";
        state.reviewId = proposal.id;
        state.lastAction = proposal.blocked
          ? `${proposal.label}: opened the blocked-by-Guard details; no convergence route survives.`
          : `${proposal.label}: opened Proposal Review; Approval covers the complete unit outcome.`;
        break;
      }
      case "OPEN_SOURCE": {
        const source = state.additional[action.id];
        if (!source || !changed(source)) break;
        state.view = "source";
        state.reviewId = source.id;
        state.lastAction = `${source.repo}:${source.path}: opened its one canonical Source Change Review.`;
        break;
      }
      case "SET_INTENT": {
        const proposal = proposalById(state, action.id);
        if (!proposal || !proposal.allowed.includes(action.intent)) break;
        if (proposal.intent === action.intent && proposal.editedPrimary === null) {
          state.lastAction = `${proposal.label}: ${intentLabel(action.intent)} was already selected.`;
          break;
        }
        const approvalWasStanding = proposal.approved;
        proposal.intent = action.intent;
        proposal.editedPrimary = null;
        proposal.materialized = false;
        proposal.invalidReason = "Resolution Intent changed";
        if (proposal.approved) materialize(state, proposal, "Intent-change rematerialization");

function deckButtons() {
  const entity = focusedEntity();
  const isProposal = state.focus.type === "proposal";
  const blocked = isProposal && entity?.blocked;
  const approved = Boolean(entity?.approved);
  const allowed = isProposal ? entity.allowed : [];
  return `<div class="command-bar">
    <button class="button primary" onclick="openFocused()">Review focused <span class="key">Enter</span></button>
    <button class="button" onclick="openEditorFocused()" ${!isProposal || blocked ? "disabled" : ""}>Proposal Editor <span class="key">e</span></button>
    <button class="button" onclick="setFocusedIntent('repo')" ${!allowed.includes("repo") ? "disabled" : ""}>Use repository <span class="key">r</span></button>
    <button class="button" onclick="setFocusedIntent('live')" ${!allowed.includes("live") ? "disabled" : ""}>Use live <span class="key">l</span></button>
    <button class="button" onclick="setFocusedIntent('merge')" ${!allowed.includes("merge") ? "disabled" : ""}>Merge <span class="key">m</span></button>
    <button class="button" onclick="toggleFocusedApproval()" ${blocked ? "disabled" : ""}>${approved ? "Unapprove" : "Approve"} focused <span class="key">a</span></button>
    <button class="button" onclick="dispatch({type:'BATCH_APPROVE'})">Approve eligible <span class="key">A</span></button>
    <button class="button" onclick="dispatch({type:'UNAPPROVE_ALL'})">Unapprove all <span class="key">U</span></button>
    <button class="button primary" onclick="dispatch({type:'OPEN_CONFIRM'})">Converge approved</button>
  </div>`;
}
function diff(before, after) {
  if (before === after) return '<span class="empty">No filesystem write in this destination.</span>';
  const left = String(before).split("\n"), right = String(after).split("\n"), lines = [];
  for (let index = 0; index < Math.max(left.length, right.length); index += 1) {
    if (left[index] === right[index]) lines.push(`  ${html(left[index] ?? "")}`);
    else {
      if (left[index] !== undefined) lines.push(`<span class="remove">- ${html(left[index])}</span>`);
      if (right[index] !== undefined) lines.push(`<span class="add">+ ${html(right[index])}</span>`);
    }
  }
  return lines.join("\n");
}
function intentButtons(item) {
  return ["repo", "live", "merge"].map((intent) => `<button class="button ${item.intent === intent ? "selected-intent" : ""}" onclick="setIntent('${item.id}','${intent}')" ${!item.allowed.includes(intent) ? "disabled" : ""}>${intentLabel(intent)}${item.intent === intent ? " ✓" : ""}</button>`).join("");
}
function proposalReview() {
  const item = proposal(state.reviewId);
  if (!item) return deck();
  const additional = item.additionalIds.map(source).filter((candidate) => candidate && SyncDeckLogic.changed(candidate));
  if (item.blocked) {
    return `<div class="shell">${scenarioPanel()}<section class="panel review-shell"><header class="review-header"><div><div class="eyebrow">Proposal Review · frozen diagnostic</div><h2>${html(item.label)}</h2><p class="mono">Repository: ${html(item.primaryPath)}<br>Live: ${html(item.livePath)}</p></div><span class="badge red">Not approvable</span></header>
      <div class="review-body"><main class="review-main"><h3>Why resolution is blocked</h3><div class="review-title red">No convergence route survives</div><p>${html(item.blockedReason)}</p><pre class="diff">configured policy  ${html(item.configuredPolicy)}\nguard_push        exit 100\nguard_pull        exit 100\neffective policy no route</pre></main>
      <aside class="review-facts"><div class="fact"><div class="fact-label">Sync Base</div><div class="fact-value">${html(item.baseDetail)}</div></div><div class="fact"><div class="fact-label">Editor</div><div class="fact-value">Unavailable</div><p class="tiny muted">Editor is available only while at least one convergence route survives.</p></div></aside></div>
      <footer class="review-footer"><button class="button return" onclick="returnDeck()">Command Deck <span class="key">Esc</span></button></footer></section></div>`;
  }
  const primaryAfter = item.materialized ? item.repositoryOutcome : item.repositoryFrozen;
  const liveAfter = item.materialized ? item.liveOutcome : item.liveFrozen;
  return `<div class="shell">${scenarioPanel()}<section class="panel review-shell">
    <header class="review-header"><div><div class="eyebrow">Proposal Review · same terminal interaction</div><h2>${html(item.label)}</h2><p class="mono">Repository: ${html(item.primaryPath)}<br>Live: ${html(item.livePath)}</p></div><div class="status-line">${approvalMark(item.approved)}<span class="badge ${item.materialized ? "green" : "gray"}">${item.materialized ? "Materialized" : "Lazy"}</span></div></header>
    <div class="intent-strip"><div><div class="fact-label">Resolution Intent</div><div class="intent-actions">${intentButtons(item)}</div></div><div>${policyMarkup(item)}</div></div>
    <div class="review-body"><main class="review-main">
      <h3>Primary Source Change</h3><div class="review-title">${item.editedPrimary !== null ? "Edited" : intentLabel(item.intent)}</div><pre class="diff">${item.materialized ? diff(item.repositoryFrozen, primaryAfter) : '<span class="empty">Not materialized. Review or Approval will produce the frozen Proposal.</span>'}</pre>
      <h3>Policy-derived Publication Effect</h3><pre class="diff">${item.materialized ? diff(item.liveFrozen, liveAfter) : '<span class="empty">Not materialized.</span>'}</pre>
      <div class="divider"></div><h3>Referenced Additional Changes · canonical approval lives in Source Change Review</h3>
      <div class="refs">${additional.length ? additional.map((candidate) => `<div class="ref-row"><button onclick="openSource('${candidate.id}')">${html(candidate.repo)}:${html(candidate.path)}<br><span class="tiny muted">${candidate.approved ? "Approved candidate included" : "Unapproved candidate excluded; frozen preimage used"}</span></button>${approvalMark(candidate.approved)}</div>`).join("") : '<p class="empty">No staged Additional Changes.</p>'}</div>
    </main><aside class="review-facts">
      <div class="fact"><div class="fact-label">Whole-unit Approval</div><div class="fact-value">${item.approved ? "Standing authorization" : "Not approved"}</div><p class="tiny muted">Covers this Proposal's Primary effect, live effects, and conditional Sync Base acknowledgment.</p></div>
      <div class="fact"><div class="fact-label">Sync Base</div><div class="fact-value">${html(item.baseDetail)}</div></div>
      <div class="fact"><div class="fact-label">Frozen effects</div><div class="fact-value">Repository: ${item.materialized ? effectLabel(item.primaryEffect) : "pending"}<br>Live: ${item.materialized ? effectLabel(item.liveEffect) : "pending"}</div></div>
      <div class="fact"><div class="fact-label">Latest alignment</div><div class="fact-value small">${html(item.lastMaterialization || item.invalidReason || "Not materialized yet")}</div></div>
    </aside></div>
    <footer class="review-footer"><button class="button primary" onclick="openEditorProposal('${item.id}')">Proposal Editor <span class="key">e</span></button><button class="button" onclick="dispatch({type:'TOGGLE_PROPOSAL_APPROVAL',id:'${item.id}'})">${item.approved ? "Unapprove" : "Approve"} unit <span class="key">a</span></button><button class="button return" onclick="returnDeck()">Command Deck <span class="key">Esc</span></button></footer>
  </section></div>`;
}
function sourceReview() {
  const item = source(state.reviewId);
  if (!item || !SyncDeckLogic.changed(item)) return deck();
  return `<div class="shell">${scenarioPanel()}<section class="panel review-shell">
    <header class="review-header"><div><div class="eyebrow">Source Change Review · canonical Additional row</div><h2>${html(item.path)}</h2><p class="mono">${html(item.repo)} repository · frozen-preimage diff</p></div><div class="status-line">${approvalMark(item.approved)}<span class="badge ${item.approved ? "green" : "amber"}">${item.approved ? "Approved independently" : "Unapproved"}</span></div></header>
    <div class="review-body"><main class="review-main"><h3>Frozen-preimage diff</h3><div class="review-title">Additional Source Change</div><pre class="diff">${diff(item.frozen, item.current)}</pre>
      <div class="review-actions"><button class="button primary" onclick="dispatch({type:'TOGGLE_ADDITIONAL_APPROVAL',id:'${item.id}'})">${item.approved ? "Unapprove" : "Approve"} Additional Change <span class="key">a</span></button></div>
      <div class="divider"></div><h3>Referencing Proposals</h3><div class="refs">${item.references.map((id) => { const ref = proposal(id); return `<div class="ref-row"><button onclick="openProposal('${id}')">${html(ref.label)}<br><span class="tiny muted">${ref.approved ? "Approved: aligns immediately" : "Unapproved: stale preview becomes lazy"}</span></button>${approvalMark(ref.approved, ref.blocked)}</div>`; }).join("")}</div>
    </main><aside class="review-facts"><div class="fact"><div class="fact-label">Approval contract</div><div class="fact-value">Independent repository write</div><p class="tiny muted">Its success never gates a Proposal's Converged result or Base acknowledgment.</p></div><div class="fact"><div class="fact-label">Alignment contract</div><div class="fact-value">Unapproved candidate bytes are excluded</div><p class="tiny muted">Dependent Proposals use the frozen preimage instead.</p></div><div class="fact"><div class="fact-label">Repository Apply</div><div class="fact-value">Written once before all Primaries</div></div></aside></div>
    <footer class="review-footer"><button class="button primary" onclick="openEditorProposal('${item.references[0]}')">Edit via referencing Proposal <span class="key">e</span></button><button class="button return" onclick="returnDeck()">Command Deck <span class="key">Esc</span></button></footer>
  </section></div>`;
}
function editor() {
  const item = proposal(state.reviewId);
  const additional = item.additionalIds.map(source).filter(Boolean);
  return `<div class="shell">${scenarioPanel()}<section class="panel editor-shell"><div class="eyebrow">Proposal Editor · transactional terminal handoff</div><h1 style="font-size:clamp(1.8rem,4vw,2.7rem)">Edit the Proposal's repository sources.</h1>
    <p class="lede">The Editor may deliberately change repository sources under every surviving policy. Save rematerializes aligned effects; it never writes the working tree.</p>
    <div class="editor-source"><h3><span>Primary · <span class="mono">${html(item.primaryPath)}</span></span><span class="badge blue">exclusive</span></h3><textarea data-primary>${html(item.repositoryOutcome)}</textarea><p class="tiny muted">Changing this produces an Edited Proposal. Standing Proposal Approval remains if rematerialization succeeds.</p></div>
    ${additional.map((candidate) => `<div class="editor-source"><h3><span>Additional · <span class="mono">${html(candidate.repo)}:${html(candidate.path)}</span></span><span class="badge amber">canonical shared path</span></h3><textarea data-additional-id="${html(candidate.id)}" data-repo="${html(candidate.repo)}" data-path="${html(candidate.path)}">${html(candidate.current)}</textarea><p class="tiny muted">Approval is path-scoped and standing. Changed bytes invalidate every dependent Proposal, then align them eagerly or lazily.</p></div>`).join("")}
    <div class="editor-add"><input id="new-additional-path" placeholder="new Additional path"><button class="button" onclick="addEditorField()">Add Additional source</button></div>
    <div class="command-bar"><button class="button primary" onclick="saveEditor('${item.id}')">Return and adopt edits</button><button class="button" onclick="cancelEditor()">Cancel Editor <span class="key">Esc</span></button></div>
  </section></div>`;
}
function confirmation() {
  const frozen = state.frozenExecution;
  return `<div class="shell confirm-shell">${scenarioPanel()}<section class="confirm-card"><div class="eyebrow">Compact final confirmation · frozen set</div><h1>Converge approved work?</h1><p>Editing and Approval toggles are closed only after confirmation. Execution will not Capture, Render, reconcile, observe, or replan.</p>
    <div class="count-grid"><div><strong>${frozen.approvedProposalIds.length}</strong><span>approved units</span></div><div><strong>${frozen.repositoryChanges}</strong><span>repository changes</span></div><div><strong>${frozen.liveWrites}</strong><span>live writes</span></div><div><strong>${frozen.liveDeletes}</strong><span>live deletions</span></div></div>
    <div class="confirm-actions"><button class="button primary" onclick="dispatch({type:'CONFIRM_EXECUTION'})" ${frozen.approvedProposalIds.length + frozen.approvedAdditionalIds.length === 0 ? "disabled" : ""}>Confirm convergence <span class="key">Enter</span></button><button class="button" onclick="dispatch({type:'CANCEL_CONFIRM'})">Back to Command Deck <span class="key">Esc</span></button></div>
    <p class="tiny muted">No detailed final-effect screen: those effects were already reviewed in the deck and focused Reviews.</p></section></div>`;
}
function terminal() {
  const report = state.executionReport;
  return `<div class="shell">${scenarioPanel()}<section class="terminal"><div class="eyebrow" style="color:#bfc3ff">Simulated terminal execution · frozen artifacts only</div><h1 style="font-size:clamp(1.8rem,4vw,2.7rem);color:#fff">${html(report.status)}</h1>
    <div class="terminal-stages"><div><h2>1 · Repository Apply</h2><ol>${report.repositoryLines.map((line, index) => `<li class="${index === 0 ? "stage-title" : "ok"}">${html(line)}</li>`).join("")}</ol></div><div><h2>2 · Live Publication</h2><ol>${report.publicationLines.map((line, index) => `<li class="${index === 0 ? "stage-title" : "ok"}">${html(line)}</li>`).join("")}</ol></div></div>
    <div class="terminal-summary"><div><h2>Healthy rows left unapproved</h2><ul>${report.pending.length ? report.pending.map((label) => `<li class="warn">${html(label)}</li>`).join("") : '<li class="ok">None</li>'}</ul></div><div><h2>Blocked diagnostics</h2><ul>${report.blocked.length ? report.blocked.map((label) => `<li class="warn">${html(label)} · not executed</li>`).join("") : '<li class="ok">None</li>'}</ul></div></div>
    <p class="tiny" style="margin-top:18px;color:#adb6c4">Additional Source Changes execute independently once, but never gate Proposal convergence. Each Base-Eligible unit acknowledges only after its own effects; push-only units complete without a fake Base.</p>
    <button class="button" onclick="resetDemo(activeScenario)">Start another simulated Sync</button>
  </section></div>`;
}
function render() {
  document.querySelector("#app").innerHTML = state.view === "deck" ? deck()
    : state.view === "proposal" ? proposalReview()
    : state.view === "source" ? sourceReview()
    : state.view === "editor" ? editor()
    : state.view === "confirm" ? confirmation()
    : terminal();
}
function returnDeck() {
  state.view = "deck";
  state.reviewId = null;
  state.lastAction = "Returned to Command Deck; the in-memory session state is unchanged.";
  state.log.unshift(`${now()} · ${state.lastAction}`);
  state.log = state.log.slice(0, 6);
  render();
}
function openFocused() {
  if (state.focus.type === "proposal") dispatch({ type: "OPEN_PROPOSAL", id: state.focus.id });
  else dispatch({ type: "OPEN_SOURCE", id: state.focus.id });
}
function openProposal(id) { dispatch({ type: "OPEN_PROPOSAL", id }); }
function openSource(id) { dispatch({ type: "OPEN_SOURCE", id }); }
function toggleFocusedApproval() {
  if (state.focus.type === "proposal") dispatch({ type: "TOGGLE_PROPOSAL_APPROVAL", id: state.focus.id });
  else dispatch({ type: "TOGGLE_ADDITIONAL_APPROVAL", id: state.focus.id });
}
function setIntent(id, intent) { dispatch({ type: "SET_INTENT", id, intent }); }
function setFocusedIntent(intent) { if (state.focus.type === "proposal") setIntent(state.focus.id, intent); }
function openEditorProposal(id) {
  const item = proposal(id);
  if (!item || item.blocked) return;
  const origin = { view: state.view, reviewId: state.reviewId };
  if (!item.materialized) state = SyncDeckLogic.dispatch(state, { type: "OPEN_PROPOSAL", id });
  state.editorOrigin = origin;
  state.view = "editor";
  state.reviewId = id;
  state.lastAction = `${item.label}: Editor received the Primary followed by referenced Additional Sources.`;
  render();
}
function openEditorFocused() { if (state.focus.type === "proposal") openEditorProposal(state.focus.id); }
function cancelEditor() {
  const origin = state.editorOrigin || { view: "deck", reviewId: null };
  state.editorOrigin = null;
  state.view = origin.view === "proposal" || origin.view === "source" ? origin.view : "deck";
  state.reviewId = origin.reviewId;
  state.lastAction = "Editor cancelled; no candidate bytes, materializations, or Approvals changed.";
  state.log.unshift(`${now()} · ${state.lastAction}`);
  render();
}
function saveEditor(id) {
  const primary = document.querySelector("[data-primary]").value;
  const additional = [...document.querySelectorAll("[data-additional-id]")].map((node) => ({
    id: node.dataset.additionalId,
    repo: node.dataset.repo,
    path: node.dataset.path,
    current: node.value,
  }));
  dispatch({ type: "EDITOR_SAVE", proposalId: id, primary, additional });
}
function addEditorField() {
  const input = document.querySelector("#new-additional-path");
  const path = input.value.trim();
  if (!path) return;
  const id = `main|${path}`;
  if (document.querySelector(`[data-additional-id="${CSS.escape(id)}"]`)) return;
  const block = document.createElement("div");
  block.className = "editor-source";
  block.innerHTML = `<h3><span>Additional · <span class="mono">main:${html(path)}</span></span><span class="badge amber">new path · starts unapproved</span></h3><textarea data-additional-id="${html(id)}" data-repo="main" data-path="${html(path)}"></textarea><p class="tiny muted">Missing frozen preimage. Saving non-empty bytes creates one canonical Additional Change.</p>`;
  input.closest(".editor-add").before(block);
  input.value = "";
}
function resetDemo(scenario = activeScenario) {
  state = initialState();
  activeScenario = scenario;
  state.log = [`${now()} · Reset simulation; no real files changed.`];
  render();
}
function selectScenario(key) { activeScenario = key; render(); }
function scenarioStep(key, index) {
  const steps = {
    policy: [
      () => resetDemo(key),
      () => openProposal("p-nvim"),
      () => openProposal("p-retired"),
      () => openProposal("p-secrets"),
    ],
    editor: [
      () => resetDemo(key),
      () => { dispatch({ type: "TOGGLE_PROPOSAL_APPROVAL", id: "p-git" }); dispatch({ type: "TOGGLE_ADDITIONAL_APPROVAL", id: "main|scripts/shared.sh" }); },
      () => openProposal("p-git"),
      () => openEditorProposal("p-git"),
      () => dispatch({
        type: "EDITOR_SAVE", proposalId: "p-git", primary: "[user]\n  name = Xian\n  signingkey = editor-key",
        additional: [
          { id: "main|scripts/shared.sh", repo: "main", path: "scripts/shared.sh", current: "#!/bin/sh\nlog() { printf '%s\\n' \"$1\"; }\nshared=edited" },
          { id: "main|config/theme.css", repo: "main", path: "config/theme.css", current: ":root { --accent: indigo; }" },
        ],
      }),
    ],
    additional: [
      () => resetDemo(key),
      () => { dispatch({ type: "TOGGLE_PROPOSAL_APPROVAL", id: "p-git" }); dispatch({ type: "TOGGLE_ADDITIONAL_APPROVAL", id: "main|scripts/shared.sh" }); },
      () => { state.view = "deck"; state.focus = { type: "source", id: "main|scripts/shared.sh" }; state.lastAction = "Focused the one canonical shared.sh row."; render(); },
      () => dispatch({ type: "TOGGLE_ADDITIONAL_APPROVAL", id: "main|scripts/shared.sh" }),
      () => openProposal("p-git"),
      () => dispatch({ type: "TOGGLE_ADDITIONAL_APPROVAL", id: "main|scripts/shared.sh" }),
    ],
    batch: [
      () => resetDemo(key),
      () => dispatch({ type: "UNAPPROVE_ALL" }),
      () => dispatch({ type: "BATCH_APPROVE" }),
      () => dispatch({ type: "OPEN_CONFIRM" }),
    ],
    execute: [
      () => resetDemo(key),
      () => {
        dispatch({ type: "TOGGLE_PROPOSAL_APPROVAL", id: "p-git" });
        dispatch({ type: "TOGGLE_PROPOSAL_APPROVAL", id: "p-nvim" });
        dispatch({ type: "TOGGLE_PROPOSAL_APPROVAL", id: "p-retired" });
        dispatch({ type: "TOGGLE_ADDITIONAL_APPROVAL", id: "main|scripts/shared.sh" });
      },
      () => dispatch({ type: "OPEN_CONFIRM" }),
      () => dispatch({ type: "CONFIRM_EXECUTION" }),
    ],
  };
  steps[key]?.[index]?.();
}

document.addEventListener("keydown", (event) => {
  const active = document.activeElement;
  if (active && active.matches("textarea,input,select,[contenteditable]")) {
    if (event.key === "Escape" && state.view === "editor") { event.preventDefault(); cancelEditor(); }
    return;
  }
  if (state.view === "terminal") return;
  if (state.view === "confirm") {
    if (event.key === "Escape") { event.preventDefault(); dispatch({ type: "CANCEL_CONFIRM" }); }
    else if (event.key === "Enter") { event.preventDefault(); dispatch({ type: "CONFIRM_EXECUTION" }); }
    return;
  }
  if (state.view === "editor") {
    if (event.key === "Escape") { event.preventDefault(); cancelEditor(); }
    return;
  }
  if (event.key === "Escape") { event.preventDefault(); returnDeck(); return; }
  if (state.view === "proposal") {
    if (event.key === "a") dispatch({ type: "TOGGLE_PROPOSAL_APPROVAL", id: state.reviewId });
    else if (event.key === "e") openEditorProposal(state.reviewId);
    else if (event.key === "r") setIntent(state.reviewId, "repo");
    else if (event.key === "l") setIntent(state.reviewId, "live");
    else if (event.key === "m") setIntent(state.reviewId, "merge");
    return;
  }
  if (state.view === "source") {
    if (event.key === "a") dispatch({ type: "TOGGLE_ADDITIONAL_APPROVAL", id: state.reviewId });
    else if (event.key === "e") openEditorProposal(source(state.reviewId).references[0]);
    return;
  }
  const list = [
    ...state.proposals.map((item) => ({ type: "proposal", id: item.id })),
    ...Object.values(state.additional).filter(SyncDeckLogic.changed).sort((a, b) => a.path.localeCompare(b.path)).map((item) => ({ type: "source", id: item.id })),
  ];
  const index = list.findIndex((item) => item.type === state.focus.type && item.id === state.focus.id);
  if (event.key === "j" || event.key === "ArrowDown") {
    event.preventDefault(); const next = list[(index + 1) % list.length]; state.focus = next; state.lastAction = `Focused ${focusedLabel()}.`; render();
  } else if (event.key === "k" || event.key === "ArrowUp") {
    event.preventDefault(); const next = list[(index - 1 + list.length) % list.length]; state.focus = next; state.lastAction = `Focused ${focusedLabel()}.`; render();
  } else if (event.key === "Enter") { event.preventDefault(); openFocused(); }
  else if (event.key === "a") { event.preventDefault(); toggleFocusedApproval(); }
  else if (event.key === "A") { event.preventDefault(); dispatch({ type: "BATCH_APPROVE" }); }
  else if (event.key === "U") { event.preventDefault(); dispatch({ type: "UNAPPROVE_ALL" }); }
  else if (event.key === "e") { event.preventDefault(); openEditorFocused(); }
  else if (event.key === "r") { event.preventDefault(); setFocusedIntent("repo"); }
  else if (event.key === "l") { event.preventDefault(); setFocusedIntent("live"); }
  else if (event.key === "m") { event.preventDefault(); setFocusedIntent("merge"); }
});

render();

</script>
