<main id="app"></main>
<script>
/*
  PROTOTYPE QUESTION
  Does a Dense Command Deck preserve the fast Proposal workflow while making each
  Source Change generation the approval unit, one canonical row for shared
  Additional Changes, without hiding Editor invalidation or the approved subset
  that Apply will write? This is an in-memory interaction prototype; no files change.
*/

// Portable state module: no DOM, no event handlers, and no rendering knowledge.
const SourceChangeLogic = (() => {
  const clone = (value) => structuredClone(value);
  const same = (a, b) => a.presence === b.presence && a.bytes === b.bytes && a.executable === b.executable;
  const sourceId = (repo, path) => `${repo}|${path}`;
  const changed = (source) => !same(source.frozen, source.current);
  const ensureSource = (state, source) => {
    const existing = state.sources[source.id];
    if (existing) return existing;
    state.sources[source.id] = clone(source);
    return state.sources[source.id];
  };
  const updateReferences = (state) => {
    Object.values(state.sources).forEach((source) => { source.references = []; });
    state.proposals.forEach((proposal) => {
      proposal.additionalIds.forEach((id) => {
        if (state.sources[id]) state.sources[id].references.push(proposal.id);
      });
    });
    Object.keys(state.sources).forEach((id) => {
      if (state.sources[id].kind === "additional" && !changed(state.sources[id])) delete state.sources[id];
    });
  };
  function stage(state, template, desired) {
    const current = state.sources[template.id];
    state.stagedValues[template.id] = clone(desired);
    if (same(desired, template.frozen)) {
      if (current) delete state.sources[template.id];
      return;
    }
    if (!current) {
      const generation = (state.generations[template.id] || 0) + 1;
      state.generations[template.id] = generation;
      state.sources[template.id] = { ...clone(template), current: clone(desired), generation, approval: "pending", applied: false };
      return;
    }
    if (same(current.current, desired)) return;
    current.current = clone(desired);
    current.generation += 1;
    state.generations[template.id] = current.generation;
    current.approval = "pending";
    current.applied = false;
  }
  function materialize(state, proposal) {
    if (!proposal.materialized) {
      proposal.materialized = true;
      const primary = state.sourceTemplates[proposal.primaryId];
      stage(state, primary, proposal.strategy === "replace" ? primary.capture : proposal.strategy === "edited" ? (proposal.editedPrimary || primary.capture) : primary.merge);
      proposal.additionalIds.forEach((id) => {
        const template = state.sourceTemplates[id];
        if (template) stage(state, template, template.capture);
      });
    }
  }
  function dispatch(input, action) {
    const state = clone(input);
    if (action.type !== "RESET" && state.sessionEnded) return state;
    switch (action.type) {
      case "RESET": return clone(action.state);
      case "FOCUS": state.focus = action.focus; state.lastAction = `Focused ${action.label}.`; break;
      case "OPEN_PROPOSAL": {
        const proposal = state.proposals.find((item) => item.id === action.id);
        if (!proposal) break;
        materialize(state, proposal); state.view = "proposal"; state.reviewId = proposal.id; state.lastAction = `${proposal.label}: opened Proposal Review; primary approval remains here.`; break;
      }
      case "OPEN_SOURCE": {
        if (!state.sources[action.id]) break;
        state.view = "source"; state.reviewId = action.id; state.lastAction = `${state.sources[action.id].path}: opened Source Change Review with frozen preimage.`; break;
      }
      case "SET_STRATEGY": {
        const proposal = state.proposals.find((item) => item.id === action.id);
        if (!proposal) break;
        if (proposal.strategy === action.strategy) {
          state.lastAction = `${proposal.label}: ${action.strategy} was already selected; materialization and approval were preserved.`;
          break;
        }
        proposal.strategy = action.strategy;
        proposal.materialized = false;
        proposal.editedPrimary = null;
        delete state.sources[proposal.primaryId];
        state.lastAction = `${proposal.label}: selected ${action.strategy}; Primary result deferred and prior approval cleared. Press Enter, a, or A to rematerialize.`; break;
      }
      case "TOGGLE_APPROVAL": {
        let source = state.sources[action.id];
        if (!source && action.proposalId) {
          const proposal = state.proposals.find((item) => item.id === action.proposalId);
          if (proposal) { materialize(state, proposal); source = state.sources[action.id]; }
        }
        if (!source) { state.lastAction = "Nothing staged here yet; Enter or A materializes the lazy Proposal first."; break; }
        if (source.eligible === false) { source.approval = "pending"; state.lastAction = `${source.path}: blocked; this Source Change is not eligible for approval.`; break; }
        source.approval = source.approval === "approved" ? "pending" : "approved";
        state.lastAction = `${source.path}: ${source.approval === "approved" ? "approved" : "approval removed"} for generation ${source.generation}.`; break;
      }
      case "BATCH_APPROVE": {
        state.proposals.forEach((proposal) => { if (proposal.eligible) materialize(state, proposal); });
        Object.values(state.sources).forEach((source) => { if (source.eligible !== false) source.approval = "approved"; });
        state.lastAction = "Approve eligible materialized every eligible Proposal, then approved primary and existing additional generations independently."; break;
      }
      case "UNAPPROVE_ALL": {
        Object.values(state.sources).forEach((source) => { source.approval = "pending"; });
        state.lastAction = "Unapprove all cleared Primary and Additional Source Change approvals; generations and bytes stayed put."; break;
      }
      case "EDITOR_SAVE": {
        const proposal = state.proposals.find((item) => item.id === action.proposalId);
        if (!proposal) break;
        materialize(state, proposal);
        const updates = action.updates;
        updates.forEach((update) => {
          const template = state.sourceTemplates[update.id] || { id: update.id, kind: "additional", repo: update.repo, path: update.path, frozen: { presence: "missing", bytes: "", executable: false }, capture: update.value, current: update.value, generation: 0, approval: "pending", references: [proposal.id], eligible: true };
          state.sourceTemplates[update.id] = clone(template);
          stage(state, state.sourceTemplates[update.id], update.value);
          if (template.kind === "additional" && !proposal.additionalIds.includes(template.id)) proposal.additionalIds.push(template.id);
          if (template.kind === "primary") proposal.editedPrimary = update.value;
        });
        proposal.strategy = "edited"; proposal.materialized = true; updateReferences(state);
        state.editorOrigin = null;
        state.view = "proposal"; state.reviewId = proposal.id; state.lastAction = `${proposal.label}: Editor saved. Only changed generations reset approval; identical saves preserve it.`; break;
      }
      case "APPLY": {
        const approved = Object.values(state.sources).filter((source) => source.approval === "approved");
        const pending = Object.values(state.sources).filter((source) => source.approval !== "approved");
        const additions = approved.filter((source) => source.kind === "additional").sort((a, b) => a.path.localeCompare(b.path));
        const primaries = approved.filter((source) => source.kind === "primary").sort((a, b) => {
          const pa = state.proposals.findIndex((proposal) => proposal.primaryId === a.id); const pb = state.proposals.findIndex((proposal) => proposal.primaryId === b.id); return pa - pb;
        });
        state.applyReport = { preHook: approved.length ? "repository pre-hook" : null, additions: additions.map((source) => source.path), primaries: primaries.map((source) => source.path), postHook: approved.length ? "repository post-hook" : null, pending: pending.map((source) => `${source.path} (generation ${source.generation})`) };
        approved.forEach((source) => { source.applied = true; });
        state.sessionEnded = true; state.view = "terminal"; state.lastAction = approved.length ? "Apply approved finished the simulated Pull session." : "Apply approved found no approved changes; the simulated Pull session ended."; break;
      }
      default: break;
    }
    updateReferences(state);
    return state;
  }
  return { dispatch, sourceId, same, changed };
})();

const initialState = () => {
  const frozen = (presence, bytes, executable = false) => ({ presence, bytes, executable });
  const p1 = "p-gitconfig", p2 = "p-nvim", p3 = "p-settings";
  const aShared = "main|scripts/shared.sh", aTheme = "main|config/theme.css";
  const templates = {
    [p1]: { id:p1, kind:"primary", repo:"main", path:".gitconfig", frozen:frozen("present","[user]\n  name = Xian\n  signingkey = old-key"), capture:frozen("present","[user]\n  name = Xian\n  signingkey = new-key"), merge:frozen("present","[user]\n  name = Xian\n  signingkey = new-key"), eligible:true },
    [p2]: { id:p2, kind:"primary", repo:"main", path:"config/nvim/init.lua", frozen:frozen("missing",""), capture:frozen("present","vim.opt.number = true\nvim.opt.relativenumber = false"), merge:frozen("present","vim.opt.number = true\nvim.opt.relativenumber = false"), eligible:true },
    [p3]: { id:p3, kind:"primary", repo:"main", path:"config/app/settings.toml", frozen:frozen("present","theme = \"light\"\nfont_size = 13"), capture:frozen("present","theme = \"dark\"\nfont_size = 13"), merge:frozen("present","theme = << conflict >>\nfont_size = 13"), eligible:false },
    [aShared]: { id:aShared, kind:"additional", repo:"main", path:"scripts/shared.sh", frozen:frozen("present","#!/bin/sh\nlog() { printf '%s\\n' \"$1\"; }",true), capture:frozen("present","#!/bin/sh\nlog() { printf '%s\\n' \"$1\"; }\nshared=true",true), eligible:true },
    [aTheme]: { id:aTheme, kind:"additional", repo:"main", path:"config/theme.css", frozen:frozen("present",":root { --accent: blue; }"), capture:frozen("present",":root { --accent: indigo; }"), eligible:true }
  };
  const state = { view:"deck", focus:{ type:"proposal", id:p1 }, reviewId:null, proposals:[
    { id:p1, label:"main:git.gitconfig", syncUnit:"Git identity", primaryId:p1, additionalIds:[aShared,aTheme], strategy:"merge", materialized:true, eligible:true },
    { id:p2, label:"main:nvim.init", syncUnit:"Neovim", primaryId:p2, additionalIds:[aShared], strategy:"replace", materialized:true, eligible:true },
    { id:p3, label:"main:app.settings", syncUnit:"App settings", primaryId:p3, additionalIds:[], strategy:"merge", materialized:false, eligible:false }
  ], sourceTemplates:templates, stagedValues:{}, generations:{}, sources:{}, editorOrigin:null, lastAction:"Initial observation: two Proposals share scripts/shared.sh; no repository files changed.", log:[], sessionEnded:false };
  // Initial deck has real staged changes, while the third Proposal stays lazy.
  state.sources[p1] = { ...structuredClone(templates[p1]), current:structuredClone(templates[p1].capture), generation:1, approval:"approved", applied:false, references:[] };
  state.sources[p2] = { ...structuredClone(templates[p2]), current:structuredClone(templates[p2].capture), generation:1, approval:"pending", applied:false, references:[] };
  state.sources[aShared] = { ...structuredClone(templates[aShared]), current:structuredClone(templates[aShared].capture), generation:1, approval:"pending", applied:false, references:[] };
  state.sources[aTheme] = { ...structuredClone(templates[aTheme]), current:structuredClone(templates[aTheme].capture), generation:1, approval:"approved", applied:false, references:[p1] };
  state.sources[aShared].references = [p1, p2];
  state.stagedValues[p1] = structuredClone(templates[p1].capture); state.stagedValues[p2] = structuredClone(templates[p2].capture); state.stagedValues[aShared] = structuredClone(templates[aShared].capture); state.stagedValues[aTheme] = structuredClone(templates[aTheme].capture);
  state.generations[p1] = 1; state.generations[p2] = 1; state.generations[aShared] = 1; state.generations[aTheme] = 1;
  return state;
};
let state = initialState();
let activeScenario = "shared";
const scenarios = {
  shared: { title:"Shared Additional Change", description:"Two Proposals reference scripts/shared.sh. It appears once in Additional Changes, and one approval covers that generation for both references.", steps:["Reset this scenario", "Focus shared.sh", "Approve shared.sh"] },
  editor: { title:"Editor generation invalidation", description:"First approve shared.sh. Then save the same shared bytes alongside changed Primary and theme bytes. Shared approval and generation stay intact; changed sources become pending, and a new Additional path appears once.", steps:["Reset this scenario", "Approve shared.sh", "Open gitconfig Proposal", "Open Editor", "Save identical shared + changed Primary/theme + new Additional"] },
  independent: { title:"Primary ≠ Additional approval", description:"Approve a Proposal's primary. Its referenced Additional Changes remain pending until their own rows are approved.", steps:["Reset this scenario", "Approve gitconfig primary", "Open shared.sh review"] },

function html(value){return String(value ?? "").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}

function dispatch(action){state=SourceChangeLogic.dispatch(state,action);state.log.unshift(`${now()} · ${state.lastAction}`);state.log=state.log.slice(0,7);render();}
function source(id){return state.sources[id];}

function rowProposal(p){const s=source(p.primaryId),focused=state.focus.type==="proposal"&&state.focus.id===p.id,noChange=p.materialized&&!s;const status=s?sourceStatus(s):noChange?"No change":"Deferred";const detail=s?`generation ${s.generation}`:noChange?"nothing to approve":"Enter to materialize";return `<tr class="${focused?"current":""}" onclick="focusProposal('${p.id}')"><td class="focus-cell">${focused?"›":""}</td><td class="approval-cell">${s?approvalMark(s):'<span class="approval-mark pending">·</span>'}</td><td><strong>${html(p.label)}</strong><br><span class="tiny muted mono">${html(state.sourceTemplates[p.primaryId].path)}</span></td><td><span class="badge blue">${html(p.syncUnit)}</span></td><td><span class="badge ${s?tone(s):"gray"}">${status}</span><br><span class="tiny muted">${detail}</span></td><td><span class="badge ${p.strategy==="merge"?"blue":p.strategy==="replace"?"amber":"green"}">${html(p.strategy)}</span></td></tr>`;}

r><th></th><th>Approval</th><th class="path-col">Repository-relative path</th><th class="change-col">Change</th><th>Status / current</th><th class="refs-col">Active referencing Proposals</th></tr></thead><tbody>${adds.map(rowAdditional).join("")}</tbody></table>`:'<div class="pad muted small">No Additional Source Changes are currently staged. Reverting to a frozen preimage removes a row.</div>'}</div></section>${deckState()}${scenarioPanel()}${deckButtons()}<div class="help"><strong>Try the awkward path:</strong> focus <span class="mono">scripts/shared.sh</span> and press <span class="key">Enter</span>. Its review shows one frozen-preimage diff and both active Proposals. Press <span class="key">Esc</span> to return. Open gitconfig with <span class="key">Enter</span>, use <span class="key">e</span>, and save an identical or changed source to compare generations.</div><div class="keyboard-strip"><span><span class="key">j</span>/<span class="key">k</span> focus</span><span><span class="key">Enter</span> review</span><span><span class="key">e</span> Editor</span><span><span class="key">r</span> replacement</span><span><span class="key">m</span> merge</span><span><span class="key">a</span> focused approval</span><span><span class="key">A</span> approve eligible</span><span><span class="key">U</span> unapprove all</span><span><span class="key">Apply</span> terminal apply</span><span><span class="key">?</span> help</span></div></div>`;}

function addEditorField(){const path=document.querySelector('#new-additional-path').value.trim();if(!path)return;const id=SourceChangeLogic.sourceId('main',path);if(document.querySelector(`[data-source-id="${CSS.escape(id)}"]`)){document.querySelector('#editor-hint').textContent='That Additional path is already in this Editor session.';return;}const host=document.querySelector('.editor-add');const block=document.createElement('div');block.className='editor-source';block.innerHTML=`<h3><span>Additional · <span class="mono">${html(path)}</span></span><span class="badge amber">new staged source</span></h3><label>Presence <select data-presence-id="${html(id)}"><option value="present" selected>Present</option><option value="missing">Missing (delete)</option></select></label><textarea data-source-id="${html(id)}" data-repo="main" data-path="${html(path)}" placeholder="bytes for the new Additional source"></textarea><label><input type="checkbox" data-exec-id="${html(id)}"> executable bit</label><p class="tiny muted">This path is Missing in the frozen preimage. Saving it as Present creates generation 1 even when its bytes are empty.</p>`;host.parentElement.insertBefore(block,host);document.querySelector('#new-additional-path').value='';}

function selectScenario(key){activeScenario=key;render();}
function scenarioStep(key,index){const steps={shared:[()=>resetDemo(),()=>{const id='main|scripts/shared.sh';state.focus={type:'source',id};state.view='deck';state.lastAction='Focused shared.sh; it appears once despite two references.';render();},()=>dispatch({type:'TOGGLE_APPROVAL',id:'main|scripts/shared.sh'})],editor:[()=>resetDemo(),()=>dispatch({type:'TOGGLE_APPROVAL',id:'main|scripts/shared.sh'}),()=>openProposal('p-gitconfig'),()=>openEditorProposal('p-gitconfig'),()=>{const p=proposal('p-gitconfig'),updates=[{id:'p-gitconfig',repo:'main',path:'.gitconfig',value:{presence:'present',bytes:'[user]\n  name = Xian\n  signingkey = scenario-key',executable:false}},{id:'main|scripts/shared.sh',repo:'main',path:'scripts/shared.sh',value:{presence:'present',bytes:'#!/bin/sh\nlog() { printf \'%s\\n\' "$1"; }\nshared=true',executable:true}},{id:'main|config/theme.css',repo:'main',path:'config/theme.css',value:{presence:'present',bytes:':root { --accent: violet; }',executable:false}},{id:'main|config/new.conf',repo:'main',path:'config/new.conf',value:{presence:'present',bytes:'new=true',executable:false}}];dispatch({type:'EDITOR_SAVE',proposalId:p.id,updates});}],independent:[()=>resetDemo(),()=>{state.focus={type:'proposal',id:'p-gitconfig'};dispatch({type:'UNAPPROVE_ALL'});dispatch({type:'TOGGLE_APPROVAL',id:'p-gitconfig'});},()=>openSource('main|scripts/shared.sh')],revert:[()=>resetDemo(),()=>openEditorProposal('p-gitconfig'),()=>{const p=proposal('p-gitconfig'),s=state.sourceTemplates['main|scripts/shared.sh'];dispatch({type:'EDITOR_SAVE',proposalId:p.id,updates:[{id:'main|scripts/shared.sh',repo:'main',path:'scripts/shared.sh',value:structuredClone(s.frozen)}]});}],apply:[()=>resetDemo(),()=>dispatch({type:'APPLY'})]};const action=steps[key]?.[index];if(action)action();if(index===0){activeScenario=key;render();}}
document.addEventListener('keydown',event=>{const active=document.activeElement;if(active&&active.matches('textarea,input')){if(state.view==='editor'&&event.key==='Escape'){event.preventDefault();cancelEditor();}return;}if(state.view==='editor'){if(event.key==='Escape'){event.preventDefault();cancelEditor();}return;}if(state.view==='terminal'){return;}if(event.key==='Escape'){event.preventDefault();returnDeck();return;}if(state.view==='proposal'){if(event.key==='Enter'){event.preventDefault();dispatch({type:'OPEN_PROPOSAL',id:state.reviewId});}else if(event.key==='a'){event.preventDefault();const p=proposal(state.reviewId);dispatch({type:'TOGGLE_APPROVAL',id:p.primaryId,proposalId:p.id});}else if(event.key==='e'){event.preventDefault();openEditorProposal(state.reviewId);}else if(event.key==='r'){event.preventDefault();setStrategy(state.reviewId,'replace');}else if(event.key==='m'){event.preventDefault();setStrategy(state.reviewId,'merge');}return;}if(state.view==='source'){if(event.key==='a'){event.preventDefault();dispatch({type:'TOGGLE_APPROVAL',id:state.reviewId});}else if(event.key==='e'){event.preventDefault();openEditorProposal(source(state.reviewId).references[0]);}return;}const list=[...state.proposals.map(p=>({type:'proposal',id:p.id})),...Object.values(state.sources).filter(s=>s.kind==='additional').sort((a,b)=>a.path.localeCompare(b.path)).map(s=>({type:'source',id:s.id}))];let i=list.findIndex(item=>item.type===state.focus.type&&item.id===state.focus.id);if(event.key==='j'||event.key==='ArrowDown'){event.preventDefault();const n=list[(i+1)%list.length];state.focus=n;state.lastAction=`Focused ${focusedLabel()}.`;render();}else if(event.key==='k'||event.key==='ArrowUp'){event.preventDefault();const n=list[(i-1+list.length)%list.length];state.focus=n;state.lastAction=`Focused ${focusedLabel()}.`;render();}else if(event.key==='Enter'){event.preventDefault();openFocused();}else if(event.key==='a'){event.preventDefault();focusedApproval();}else if(event.key==='A'){event.preventDefault();dispatch({type:'BATCH_APPROVE'});}else if(event.key==='U'){event.preventDefault();dispatch({type:'UNAPPROVE_ALL'});}else if(event.key==='e'){event.preventDefault();openEditorFocused();}else if(event.key==='r'){event.preventDefault();setStrategyFocused('replace');}else if(event.key==='m'){event.preventDefault();setStrategyFocused('merge');}else if(event.key==='?'){event.preventDefault();document.querySelector('.question')?.scrollIntoView({behavior:'smooth',block:'center'});}});
render();
