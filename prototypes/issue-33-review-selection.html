<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dotman — Command Deck and Proposal Review prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202631;
      --muted: #687181;
      --faint: #8d96a5;
      --paper: #f5f6f8;
      --card: #fff;
      --line: #dfe3e9;
      --line-strong: #c7ced9;
      --accent: #4f46e5;
      --accent-dark: #3730a3;
      --accent-soft: #eef0ff;
      --green: #147d58;
      --green-soft: #e8f7f0;
      --amber: #9a5b00;
      --amber-soft: #fff5df;
      --red: #b42318;
      --red-soft: #fff0ee;
      --shadow: 0 16px 38px rgba(29, 39, 58, .09);
      --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.45; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid rgba(79, 70, 229, .28); outline-offset: 2px; }
    .shell { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 154px; }
    .eyebrow { color: var(--accent-dark); font-size: .72rem; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin: 8px 0 12px; max-width: 880px; font-size: clamp(2rem, 4vw, 3.2rem); line-height: 1.04; letter-spacing: -.045em; }
    h2 { margin-bottom: 5px; font-size: 1.12rem; letter-spacing: -.02em; }
    h3 { margin-bottom: 5px; font-size: .96rem; }
    .lede { max-width: 900px; color: #454d5b; font-size: 1.05rem; }
    .prototype-note { display: inline-flex; gap: 8px; align-items: center; margin: 0 0 23px; padding: 7px 10px; border: 1px solid #c9c5ff; border-radius: 999px; color: var(--accent-dark); background: var(--accent-soft); font-size: .79rem; font-weight: 750; }
    .prototype-note::before { content: "PROTOTYPE"; letter-spacing: .1em; font-size: .65rem; }
    .button { border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 12px; background: var(--card); box-shadow: 0 2px 5px rgba(29,39,58,.04); }
    .button:hover { border-color: var(--accent); background: #fbfbff; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .button.primary:hover { background: var(--accent-dark); }
    .button:disabled { cursor: not-allowed; opacity: .42; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin: 21px 0 16px; }
    .key { display: inline-flex; min-width: 1.5em; justify-content: center; padding: 1px 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; background: #fff; color: #3d4654; font: 700 .78em ui-monospace, SFMono-Regular, Menlo, monospace; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
    .pad { padding: 18px; }
    .panel-header { display: flex; gap: 12px; align-items: start; justify-content: space-between; padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
    .panel-header p { margin: 0; color: var(--muted); font-size: .84rem; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .small { font-size: .82rem; }
    .tiny { font-size: .73rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .status-line { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 8px; font-size: .71rem; font-weight: 800; white-space: nowrap; }
    .badge.blue { color: var(--accent-dark); background: var(--accent-soft); }
    .badge.green { color: var(--green); background: var(--green-soft); }
    .badge.amber { color: var(--amber); background: var(--amber-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .badge.gray { color: #596273; background: #eef0f3; }
    .divider { height: 1px; margin: 15px 0; background: var(--line); }
    .help { margin-top: 15px; padding: 11px 13px; border: 1px dashed var(--line-strong); border-radius: 10px; background: #fbfcfd; color: var(--muted); font-size: .78rem; }
    .help strong { color: var(--ink); }
    .keyboard-strip { display: flex; flex-wrap: wrap; gap: 7px 13px; margin-top: 13px; color: var(--muted); font-size: .75rem; }
    .keyboard-strip span { display: inline-flex; gap: 5px; align-items: center; }
    .switcher { position: fixed; z-index: 5; top: 14px; right: 18px; display: flex; gap: 10px; align-items: center; padding: 8px 11px; border: 1px solid #353c4a; border-radius: 999px; background: #232a36; color: #fff; box-shadow: 0 12px 34px rgba(23,29,41,.25); }
    .switcher button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #3d4654; color: white; }
    .switcher button:hover { background: var(--accent); }
    .switcher-label { min-width: 190px; text-align: center; font-size: .76rem; }
    .switcher-label strong { color: #dfe3ff; }

    /* The product-shaped Command Deck: one compact workset, no permanent detail panes. */
    .deck-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; justify-content: space-between; padding: 20px 20px 15px; border-bottom: 1px solid var(--line); }
    .deck-head h2 { margin-bottom: 3px; }
    .deck-head p { margin: 0; color: var(--muted); font-size: .84rem; }
    .deck-stats { display: flex; flex-wrap: wrap; gap: 7px; }
    .command-bar { position: fixed; z-index: 20; left: 50%; bottom: 14px; display: flex; width: min(1180px, calc(100% - 36px)); flex-wrap: wrap; gap: 8px; align-items: center; transform: translateX(-50%); padding: 10px 13px; border: 1px solid #353c4a; border-radius: 11px; background: #232a36; color: white; box-shadow: 0 10px 24px rgba(23,29,41,.24); }
    .command-bar .button { border-color: #697484; background: #3d4654; color: white; box-shadow: none; }
    .command-bar .button:hover { border-color: #9a9ffb; background: #4b5665; }
    .command-bar .button.primary { border-color: #7771ed; background: var(--accent); }
    .command-bar .button.primary:hover { background: var(--accent-dark); }
    .command-bar .bar-status { margin-left: auto; color: #b7c0ce; font-size: .76rem; }
    .deck-table { width: 100%; border-collapse: collapse; }
    .deck-table th { padding: 11px 14px; border-bottom: 1px solid var(--line-strong); color: var(--faint); font-size: .66rem; letter-spacing: .1em; text-align: left; text-transform: uppercase; }
    .deck-table td { padding: 13px 14px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: .81rem; }
    .deck-table tr { cursor: pointer; }
    .deck-table tbody tr:hover { background: #fafaff; }
    .deck-table tbody tr.current { background: var(--accent-soft); }
    .deck-table tbody tr.applied { opacity: .55; }
    .deck-table tbody tr:last-child td { border-bottom: 0; }
    .deck-table .approval-cell { width: 54px; text-align: center; }
    .deck-table .focus-cell { width: 30px; color: var(--accent); font-size: 1.1rem; }
    .approval-mark { display: inline-grid; width: 22px; height: 22px; place-items: center; border-radius: 50%; font-weight: 900; }
    .approval-mark.approved { color: var(--green); background: var(--green-soft); }
    .approval-mark.pending { color: var(--faint); background: #eef0f3; }
    .approval-mark.blocked { color: var(--red); background: var(--red-soft); }
    .deck-table strong { font-weight: 800; }
    .check { width: 16px; height: 16px; accent-color: var(--accent); }
    .mode-text { font-weight: 800; }

    /* Variant A — a dense command table. */
    .variant-a .deck-table .repo-col { width: 29%; }
    .variant-a .deck-table .status-col { width: 17%; }
    .variant-a .deck-table .base-col { width: 21%; }
    .variant-a .deck-table .proposal-col { width: 24%; }

    /* Variant B — status lanes, still one workset rather than permanent panes. */
    .lane-list { display: grid; gap: 0; }
    .lane { border-bottom: 1px solid var(--line); }
    .lane:last-child { border-bottom: 0; }
    .lane-title { display: flex; gap: 9px; align-items: center; padding: 13px 20px 8px; color: #4c5666; font-size: .72rem; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    .lane-row { display: grid; grid-template-columns: 28px 24px minmax(180px, 1.4fr) minmax(125px, .75fr) minmax(125px, .75fr); gap: 9px; align-items: center; padding: 10px 20px 13px; border: 1px solid transparent; border-left: 3px solid transparent; cursor: pointer; }
    .lane-row:hover { background: #fafaff; }
    .lane-row.current { border-color: #bbb8f7; border-left-color: var(--accent); background: var(--accent-soft); }
    .lane-row.applied { opacity: .55; }
    .lane-row .item-title { font-weight: 800; }
    .lane-row .item-path { display: block; margin-top: 2px; color: var(--muted); font-size: .74rem; }
    .lane-row .lane-status { color: var(--muted); font-size: .76rem; }

    /* Variant C — keyboard-first deck with rows as command targets. */
    .variant-c .deck-head { align-items: center; background: #232a36; color: white; }
    .variant-c .deck-head p { color: #b7c0ce; }
    .variant-c .deck-head .eyebrow { color: #bfc3ff; }
    .variant-c .deck-head .badge { background: #3d4654; color: #e8eaff; }
    .variant-c .command-bar { margin-top: 0; border-color: #4b5665; border-radius: 0 0 13px 13px; background: #303947; }
    .variant-c .deck-table th { background: #f0f1f4; }
    .variant-c .deck-table .focus-cell { font-size: .95rem; }
    .variant-c .deck-table td { padding-top: 15px; padding-bottom: 15px; }

    /* Proposal Review is a separate full-screen view in the TUI model. */
    .review-shell { min-height: 76vh; display: grid; grid-template-rows: auto auto 1fr; }
    .review-header { display: flex; flex-wrap: wrap; gap: 13px; align-items: start; justify-content: space-between; padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
    .review-header h2 { margin: 8px 0 3px; font-size: clamp(1.35rem, 3vw, 2rem); }
    .review-header p { margin: 0; color: var(--muted); font-size: .83rem; }
    .review-header-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .review-banner { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 11px 22px; border-bottom: 1px solid var(--line); background: #fbfcfd; color: #4c5666; font-size: .8rem; }
    .review-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .42fr); gap: 20px; padding: 22px; }
    .review-main { min-width: 0; }
    .review-main h3 { font-size: .77rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
    .proposal-title { margin: 8px 0 7px; color: var(--accent-dark); font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 850; letter-spacing: -.04em; }
    .proposal-title.conflict { color: var(--red); }
    .proposal-summary { max-width: 760px; color: #4c5666; font-size: 1rem; }
    .proposal-box { margin: 19px 0; padding: 16px; border: 1px solid #c8c5fa; border-radius: 11px; background: #fafaff; }
    .proposal-box.conflict { border-color: #e4bbb6; background: #fffafa; }
    .proposal-box.noop { border-color: var(--line); background: #fbfcfd; }
    .proposal-box h3 { display: flex; gap: 9px; align-items: center; justify-content: space-between; margin: 0; color: var(--ink); font-size: .92rem; letter-spacing: 0; text-transform: none; }
    .proposal-box p { margin: 9px 0 0; color: #4c5666; font-size: .84rem; }
    .proposal-diff { margin: 13px 0 0; padding: 13px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #3d4654; white-space: pre-wrap; font: .78rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .proposal-diff .add { color: var(--green); }
    .proposal-diff .remove { color: var(--red); }
    .proposal-empty { color: var(--muted); font-style: italic; }
    .review-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 17px; }
    .review-actions .button { min-width: 126px; text-align: left; }
    .evidence { display: grid; gap: 10px; }
    .evidence details { border: 1px solid var(--line); border-radius: 10px; background: #fbfcfd; }
    .evidence summary { padding: 10px 12px; cursor: pointer; color: #4c5666; font-size: .79rem; font-weight: 850; }
    .evidence pre { margin: 0; padding: 0 12px 12px; overflow: auto; white-space: pre-wrap; font: .75rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .review-facts { display: grid; gap: 10px; align-content: start; }
    .fact { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fbfcfd; }
    .fact-label { color: var(--faint); font-size: .66rem; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; }
    .fact-value { margin-top: 4px; font-size: .82rem; font-weight: 750; }
    .review-footer { position: fixed; z-index: 20; left: 50%; bottom: 14px; display: flex; width: min(1180px, calc(100% - 36px)); flex-wrap: wrap; gap: 8px; align-items: center; transform: translateX(-50%); padding: 10px 13px; border: 1px solid #353c4a; border-radius: 11px; background: #232a36; color: white; font-size: .76rem; box-shadow: 0 10px 24px rgba(23,29,41,.24); }
    .review-footer .button { border-color: #697484; background: #3d4654; color: white; box-shadow: none; }
    .review-footer .button:hover { border-color: #9a9ffb; background: #4b5665; }
    .review-footer .return { margin-left: auto; }

    /* Proposal Editor handoff simulation. */
    .editor-shell { min-height: 76vh; padding: 23px; }
    .editor-shell textarea { width: 100%; min-height: 310px; margin: 17px 0; padding: 13px; border: 1px solid var(--line-strong); border-radius: 9px; resize: vertical; font: .83rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .editor-stage { margin-top: 15px; padding: 12px; border-radius: 10px; color: var(--accent-dark); background: var(--accent-soft); font-size: .82rem; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 620px); padding-top: 22px; padding-bottom: 190px; }
      .deck-table { display: block; overflow-x: auto; min-width: 680px; }
      .deck-wrap { overflow-x: auto; }
      .review-body { grid-template-columns: 1fr; }
      .review-shell, .editor-shell { min-height: 82vh; }
      .review-footer .return { margin-left: 0; }
      .command-bar .bar-status { margin-left: 0; width: 100%; }
      .switcher { top: 10px; right: 11px; left: auto; transform: none; justify-content: space-between; }
      .command-bar, .review-footer { width: calc(100% - 22px); bottom: 10px; }
      .switcher-label { min-width: 0; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    // Prototype question: can a compact Command Deck stay usable at any terminal
    // width when Proposal Review is a separate full-screen view in the same TUI?
    // This is a throwaway in-memory simulation. It never touches repository files.

    const variants = [
      { key: "A", name: "Dense workset" },
      { key: "B", name: "Status lanes" },
      { key: "C", name: "Keyboard deck" },
    ];
    const seedItems = [
      {
        id: "gitconfig", label: "main:git.gitconfig", path: "~/.gitconfig", status: "Observed drift", statusTone: "blue",
        base: "Exact · 8e7a2c1", baseTone: "green", baseDetail: "Clean committed ancestor; payload is available.", capture: "Captured", captureOk: true,
        canMerge: true, strategy: "merge", defaultMode: "merge", cleanProposal: true,
        repoView: "[user]\n  name = Xian\n  signingkey = old-key", liveView: "[user]\n  name = Xian\n  signingkey = new-key", captureView: "[user]\n  name = Xian\n  signingkey = new-key",
        mergeSummary: "Keep the repository-only name and take the live signing key.", replaceSummary: "Replace the repository source with the captured live representation.",
      },
      {
        id: "nvim", label: "main:nvim.init", path: "~/.config/nvim/init.lua", status: "Observed drift", statusTone: "blue",
        base: "Missing", baseTone: "amber", baseDetail: "No applicable commit-anchored Sync Base exists.", capture: "Captured", captureOk: true,
        canMerge: false, strategy: "replace", defaultMode: "replace", cleanProposal: true,
        repoView: "vim.opt.number = true\nvim.opt.relativenumber = true", liveView: "vim.opt.number = true\nvim.opt.relativenumber = false", captureView: "vim.opt.number = true\nvim.opt.relativenumber = false",
        mergeSummary: "A merge cannot be attempted without an applicable Base.", replaceSummary: "Create a replacement proposal because this unit has no Base.",
      },
      {
        id: "settings", label: "main:app.settings", path: "~/.config/app/settings.toml", status: "Observed drift", statusTone: "blue",
        base: "Conservative · 5b14f90", baseTone: "amber", baseDetail: "A dirty source established an older conservative ancestor.", capture: "Captured", captureOk: true,
        canMerge: true, strategy: "merge", defaultMode: "merge", cleanProposal: false, conflict: true,
        repoView: "theme = \"light\"\nfont_size = 13\nlocal_only = true", liveView: "theme = \"dark\"\nfont_size = 13\nlocal_only = true", captureView: "theme = \"dark\"\nfont_size = 13\nlocal_only = true",
        mergeSummary: "Conflict: repository and live both changed `theme` from the conservative Base.", replaceSummary: "Discard repository-side changes and use the captured live settings.",
      },
      {
        id: "secrets", label: "main:secrets.env", path: "~/.config/app/secrets.env", status: "Capture failed", statusTone: "red",
        base: "Exact · 6d2aa90", baseTone: "green", baseDetail: "Base is intact, but Capture did not produce repository bytes.", capture: "Failed · exit 1", captureOk: false,
        canMerge: false, strategy: null, defaultMode: null, cleanProposal: false,
        repoView: "TOKEN=managed\nROTATION=weekly", liveView: "(unavailable — Capture command failed)", captureView: "(no Capture result)",
        mergeSummary: "No Proposal can be materialized until Capture succeeds or an Editor resolves it.", replaceSummary: "Replacement is unavailable without a retained Capture result.",
      },
      {
        id: "notes", label: "main:notes.txt", path: "~/Documents/notes.txt", status: "Observed agreement", statusTone: "gray",
        base: "Exact · 1c4fe11", baseTone: "green", baseDetail: "Direct Pull Views agree; this unit is a no-op.", capture: "Not needed", captureOk: true,
        canMerge: false, strategy: null, defaultMode: null, cleanProposal: false, noop: true,
        repoView: "keep a short list of ideas", liveView: "keep a short list of ideas", captureView: "(not materialized)",
        mergeSummary: "No Proposal is needed. A real no-change Pull may establish exact ancestry.", replaceSummary: "No replacement is needed because the Pull Views already agree.",
      },
    ];
    const params = new URLSearchParams(window.location.search);
    let currentVariant = (params.get("variant") || "A").toUpperCase();
    if (!variants.some((variant) => variant.key === currentVariant)) currentVariant = "A";
    const state = {
      view: "deck", selectedId: "gitconfig", reviewId: null, editor: null, showEvidence: true,
      items: structuredClone(seedItems), log: ["Pull Views observed: 3 changed units, 1 Capture failure, 1 no-op."],
      lastAction: "Initial observation — no repository files changed.",
    };

    function item(id = state.selectedId) { return state.items.find((candidate) => candidate.id === id); }
    function now() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
    function log(message) { state.lastAction = message; state.log.unshift(`${now()} · ${message}`); state.log = state.log.slice(0, 8); }
    function setVariant(key) {
      currentVariant = key;
      const next = new URL(window.location.href); next.searchParams.set("variant", key); history.replaceState(null, "", next); render();
    }
    function cycleVariant(delta) {
      const index = variants.findIndex((variant) => variant.key === currentVariant);
      setVariant(variants[(index + delta + variants.length) % variants.length].key);
    }
    function focusItem(id) { state.selectedId = id; log(`Focused ${item().label}.`); render(); }
    function materialize(candidate) {
      if (candidate.materialized || candidate.noop || !candidate.captureOk) return;
      candidate.materialized = true; candidate.mode = candidate.strategy || candidate.defaultMode; candidate.approved = false; candidate.edited = false;
      if (candidate.mode === "merge" && candidate.id === "settings") candidate.conflict = true;
      log(`${candidate.label}: materialized ${candidate.mode === "replace" ? "replacement" : "merge"} Proposal lazily.`);
    }
    function openReview(id = state.selectedId, requestedMode = null) {
      const candidate = item(id);
      state.selectedId = id; state.reviewId = id; state.view = "review";
      if (!candidate.noop && candidate.captureOk) materialize(candidate);
      if (requestedMode === "replace") chooseReplacement(false);
      log(`${candidate.label}: opened Proposal Review full-screen in the same TUI.`);
      render();
    }
    function chooseReplacement(shouldLog = true) {
      const candidate = item(state.reviewId || state.selectedId);
      if (candidate.noop) { log(`${candidate.label}: no-op has nothing to replace.`); render(); return; }
      if (!candidate.captureOk) { log(`${candidate.label}: replacement unavailable without a retained Capture result.`); render(); return; }
      const changed = (candidate.strategy || candidate.mode || candidate.defaultMode) !== "replace";
      candidate.strategy = "replace";
      if (candidate.materialized) { candidate.mode = "replace"; candidate.conflict = false; }
      if (changed) candidate.approved = false;
      if (shouldLog) log(`${candidate.label}: r selected Capture replacement${changed ? "; approval reset" : "; approval retained"}.`);
      render();
    }
    function chooseMerge() {
      const candidate = item(state.reviewId || state.selectedId);
      if (candidate.noop || !candidate.canMerge) { log(`${candidate.label}: m is unavailable without an applicable Sync Base.`); render(); return; }
      if (!candidate.captureOk) { log(`${candidate.label}: merge unavailable because Capture failed.`); render(); return; }
      const changed = (candidate.strategy || candidate.mode || candidate.defaultMode) !== "merge";
      candidate.strategy = "merge";
      if (candidate.materialized) { candidate.mode = "merge"; candidate.edited = false; if (candidate.id === "settings") candidate.conflict = true; }
      if (changed) candidate.approved = false;
      log(`${candidate.label}: m selected merge${changed ? "; approval reset" : "; approval retained"}.`); render();
    }
    function approvalAllowed(candidate) {
      const strategy = candidate.strategy || candidate.mode;
      return candidate.approved || (!candidate.noop && candidate.captureOk && (candidate.cleanProposal || candidate.edited || candidate.mode === "replace" || strategy === "replace"));
    }
    function toggleApproval() {
      const candidate = item(state.reviewId || state.selectedId);
      if (candidate.approved) {
        candidate.approved = false;
        log(`${candidate.label}: approval removed.`);
      } else if (candidate.noop) {
        log(`${candidate.label}: no-op is not approvable in changed-work review.`);
      } else if (!candidate.captureOk) {
        log(`${candidate.label}: Capture failed; use e for Editor/manual handling.`);
      } else if (!approvalAllowed(candidate)) {
        log(`${candidate.label}: conflict remains unresolved; use r or e.`);
      } else {
        materialize(candidate);
        candidate.approved = true;
        log(`${candidate.label}: approved ${candidate.mode === "replace" ? "replacement" : candidate.mode} Proposal.`);
      }
      render();
    }
    function toggleFocusedApproval() {
      const reviewId = state.reviewId;
      state.reviewId = state.selectedId;
      toggleApproval();
      state.reviewId = reviewId;
    }
    function approveEligible() {
      let approved = 0;
      state.items.forEach((candidate) => {
        if (candidate.noop || !candidate.captureOk) return;
        materialize(candidate);
        if (candidate.cleanProposal || candidate.edited || candidate.mode === "replace") { candidate.approved = true; approved += 1; }
      });
      log(`Approve eligible: ${approved} Proposal${approved === 1 ? "" : "s"} approved; conflicts and failures remain unapproved.`); render();
    }
    function applyApproved() {
      const approved = state.items.filter((candidate) => candidate.approved);
      if (!approved.length) log("Apply found no approved Proposals; no repository files changed.");
      else { approved.forEach((candidate) => { candidate.applied = true; candidate.approved = false; }); log(`Apply committed ${approved.length} approved Proposal${approved.length === 1 ? "" : "s"} atomically in the simulation.`); }
      render();
    }
    function enterEditor() {
      const candidate = item(state.reviewId || state.selectedId);
      if (candidate.noop) { log(`${candidate.label}: no-op has no Proposal Editor session.`); render(); return; }
      state.editor = { id: candidate.id, exceptional: !candidate.captureOk, text: candidate.captureOk ? (candidate.mode === "replace" ? candidate.captureView : `${candidate.repoView}\n\n# proposal edits\n`) : "Editor can inspect the Capture failure and prepare a transactional write set here." };
      state.view = "editor"; log(`${candidate.label}: suspended Proposal Review and handed the terminal to the Proposal Editor.`); render();
    }
    function saveEditor() {
      const candidate = item(state.editor.id);
      const editedText = document.querySelector("#editor-text")?.value || state.editor.text;
      if (state.editor.exceptional) { candidate.captureOk = true; candidate.capture = "Editor supplied a transactional result"; candidate.materialized = true; }
      candidate.materialized = true; candidate.edited = true; candidate.editedText = editedText; candidate.strategy = "edited"; candidate.mode = "edited"; candidate.cleanProposal = true; candidate.conflict = false; candidate.approved = false;
      state.reviewId = candidate.id; state.selectedId = candidate.id; state.editor = null; state.view = "review";
      log(`${candidate.label}: Editor returned; adopted transactional edits and reset approval.`); render();
    }
    function cancelEditor() { const candidate = item(state.editor.id); log(`${candidate.label}: Editor cancelled with exit 100; prior Proposal/status retained.`); state.editor = null; state.view = "review"; render(); }
    function returnDeck() { state.view = "deck"; state.reviewId = null; state.editor = null; log("Returned to Command Deck; no repository files changed."); render(); }
    function toggleEvidence() { state.showEvidence = !state.showEvidence; log(`${state.showEvidence ? "Showing" : "Hiding"} Pull View evidence.`); render(); }
    function resetDemo() { state.view = "deck"; state.selectedId = "gitconfig"; state.reviewId = null; state.editor = null; state.showEvidence = true; state.items = structuredClone(seedItems); state.log = ["Reset: Pull Views observed again; no repository files changed."]; state.lastAction = "Reset simulation."; render(); }

    function modeLabel(candidate) {
      if (candidate.applied) return "Applied";
      if (candidate.noop) return "No Proposal";
      if (!candidate.captureOk) return "Exceptional";
      const strategy = candidate.strategy || candidate.mode || candidate.defaultMode;
      if (candidate.approved) return strategy === "replace" ? "Replacement" : strategy === "edited" ? "Edited" : "Merge";
      if (strategy === "replace") return "Replacement";
      if (strategy === "edited") return "Edited Proposal";
      if (strategy === "merge") return candidate.materialized && candidate.conflict ? "Merge conflict" : "Merge";
      return "Unavailable";
    }
    function approvalMark(candidate) {
      if (candidate.approved) return `<span class="approval-mark approved" title="Approved">✓</span>`;
      if (candidate.noop || !candidate.captureOk || candidate.conflict) return `<span class="approval-mark blocked" title="Not approvable">!</span>`;
      return `<span class="approval-mark pending" title="Not approved">·</span>`;
    }
    function modeTone(candidate) {
      if (candidate.applied || candidate.approved) return "green";
      if (candidate.noop) return "gray";
      if (!candidate.captureOk || candidate.conflict) return "red";
      const strategy = candidate.strategy || candidate.mode || candidate.defaultMode;
      if (strategy === "replace") return "amber";
      return "blue";
    }
    function summary(candidate) {
      if (!candidate.materialized) return candidate.noop ? "No Proposal is needed because the Pull Views agree." : candidate.captureOk ? "Open Review to materialize the proposed repository change." : candidate.mergeSummary;
      if (candidate.mode === "replace") return candidate.replaceSummary;
      if (candidate.mode === "edited") return "Transactional Editor result; review it again before approval.";
      return candidate.mergeSummary;
    }
    function proposalText(candidate) {
      if (!candidate.materialized || candidate.noop || !candidate.captureOk) return "";
      if (candidate.mode === "replace") return candidate.captureView;
      if (candidate.mode === "edited") return candidate.editedText || candidate.captureView;
      if (candidate.id === "settings" && candidate.conflict) return `theme = <<<<<<< repository\n\"light\"\n=======\n\"dark\"\n>>>>>>> live\nfont_size = 13\nlocal_only = true`;
      return candidate.captureView;
    }
    function proposalDiff(before, after) {
      if (!after) return `<span class="proposal-empty">No proposed repository content.</span>`;
      const beforeLines = String(before).split("\n");
      const afterLines = String(after).split("\n");
      const rows = [];
      const length = Math.max(beforeLines.length, afterLines.length);
      for (let index = 0; index < length; index += 1) {
        const oldLine = beforeLines[index];
        const newLine = afterLines[index];
        if (oldLine === newLine) rows.push(`  ${escapeHtml(oldLine ?? "")}`);
        else {
          if (oldLine !== undefined) rows.push(`<span class="remove">- ${escapeHtml(oldLine)}</span>`);
          if (newLine !== undefined) rows.push(`<span class="add">+ ${escapeHtml(newLine)}</span>`);
        }
      }
      return rows.join("\n") || `<span class="proposal-empty">No repository-source change.</span>`;
    }
    function badges(candidate) { return `<span class="badge ${candidate.statusTone}">${candidate.status}</span><span class="badge ${candidate.baseTone}">${candidate.base}</span>`; }
    function evidence(candidate) {
      if (!state.showEvidence) return `<div class="help">Pull View evidence hidden. Press <span class="key">v</span> to show it.</div>`;
      return `<div class="evidence"><details open><summary>Repo Pull View (O)</summary><pre>${escapeHtml(candidate.repoView)}</pre></details><details open><summary>Live Pull View (T)</summary><pre>${escapeHtml(candidate.liveView)}</pre></details><details><summary>Capture result</summary><pre>${escapeHtml(candidate.captureView)}</pre></details></div>`;
    }
    function proposalBox(candidate) {
      const label = candidate.noop ? "No Proposal required" : candidate.materialized ? "Proposal diff" : "Lazy Proposal";
      const content = proposalText(candidate);
      const diff = content ? proposalDiff(candidate.repoView, content) : `<span class="proposal-empty">Proposal content appears after Enter opens Review.</span>`;
      return `<section class="proposal-box ${candidate.conflict ? "conflict" : candidate.noop ? "noop" : ""}"><h3><span>${label}</span><span class="badge ${modeTone(candidate)}">${modeLabel(candidate)}</span></h3><pre class="proposal-diff">${diff}</pre>${candidate.materialized && !candidate.noop ? `<p class="tiny muted"><strong>Write set:</strong> ${candidate.mode === "replace" ? "Capture replacement" : candidate.mode === "edited" ? "transactional Editor result" : "three-way merge"}. <strong>Approval:</strong> ${candidate.approved ? "yes" : "no"}.</p>` : ""}</section>`;
    }
    function deckActionButtons() {
      const focused = item();
      const approved = state.items.filter((candidate) => candidate.approved).length;
      return `<div class="command-bar"><button class="button primary" onclick="openReview()">Review focused <span class="key">Enter</span></button><button class="button" onclick="toggleFocusedApproval()" ${approvalAllowed(focused) ? "" : "disabled"}>${focused.approved ? "Unapprove focused" : "Approve focused"} <span class="key">a</span></button><button class="button" onclick="approveEligible()">Approve eligible <span class="key">A</span></button><button class="button primary" onclick="applyApproved()">Apply approved</button><button class="button" onclick="resetDemo()">Reset</button><span class="bar-status">${approved} approved · focused ${focused.label}</span></div>`;
    }
    function deckHeader(extraClass = "") {
      const changed = state.items.filter((candidate) => !candidate.noop).length;
      const approved = state.items.filter((candidate) => candidate.approved).length;
      return `<div class="deck-head ${extraClass}"><div><div class="eyebrow">Command Deck · Pull workset</div><h2>Choose work. Open one Proposal at a time.</h2><p>Focused: <strong>${item().label}</strong> · ${changed} changed units</p></div><div class="deck-stats"><span class="badge blue">${changed} changed</span><span class="badge ${approved ? "green" : "gray"}">${approved} approved</span><span class="badge red">1 exceptional</span></div></div>`;
    }
    function row(candidate, index) {
      return `<tr class="${candidate.id === state.selectedId ? "current" : ""} ${candidate.applied ? "applied" : ""}" onclick="focusItem('${candidate.id}')"><td class="focus-cell">${candidate.id === state.selectedId ? "›" : ""}</td><td class="approval-cell">${approvalMark(candidate)}</td><td><strong>${candidate.label}</strong><br><span class="tiny muted mono">${candidate.path}</span></td><td><span class="badge ${candidate.statusTone}">${candidate.status}</span></td><td><span class="badge ${candidate.baseTone}">${candidate.base}</span></td><td class="mode-text"><span class="badge ${modeTone(candidate)}">${modeLabel(candidate)}</span></td></tr>`;
    }
    function renderVariantA() {
      return `<section class="panel variant-a"><div class="deck-wrap">${deckHeader()}<table class="deck-table"><thead><tr><th></th><th>Approval</th><th class="repo-col">Sync Unit</th><th class="status-col">Observation</th><th class="base-col">Sync Base</th><th class="proposal-col">Proposal</th></tr></thead><tbody>${state.items.map(row).join("")}</tbody></table></div></section>`;
    }
    function lane(title, tone, candidates) {
      if (!candidates.length) return "";
      return `<section class="lane"><div class="lane-title"><span class="badge ${tone}">${candidates.length}</span>${title}</div>${candidates.map((candidate) => `<div class="lane-row ${candidate.id === state.selectedId ? "current" : ""} ${candidate.applied ? "applied" : ""}" onclick="focusItem('${candidate.id}')"><span class="lane-focus">${candidate.id === state.selectedId ? "›" : ""}</span><span class="approval-cell">${approvalMark(candidate)}</span><span><span class="item-title">${candidate.label}</span><span class="item-path mono">${candidate.path}</span></span><span class="lane-status">${candidate.base}</span><span class="badge ${modeTone(candidate)}">${modeLabel(candidate)}</span></div>`).join("")}</section>`;
    }
    function renderVariantB() {
      const changed = state.items.filter((candidate) => !candidate.noop && candidate.captureOk);
      const exceptional = state.items.filter((candidate) => !candidate.captureOk);
      const noops = state.items.filter((candidate) => candidate.noop);
      return `<section class="panel variant-b">${deckHeader()}<div class="lane-list">${lane("Ready to review", "blue", changed)}${lane("Exceptional / manual handling", "red", exceptional)}${lane("Observed agreement · no-op", "gray", noops)}</div></section>`;
    }
    function renderVariantC() {
      return `<section class="panel variant-c"><div class="deck-wrap">${deckHeader("variant-c")}<table class="deck-table"><thead><tr><th></th><th>Approval</th><th>Target</th><th>Base provenance</th><th>Next command</th><th>Proposal</th></tr></thead><tbody>${state.items.map((candidate) => `<tr class="${candidate.id === state.selectedId ? "current" : ""} ${candidate.applied ? "applied" : ""}" onclick="focusItem('${candidate.id}')"><td class="focus-cell">${candidate.id === state.selectedId ? "›" : ""}</td><td class="approval-cell">${approvalMark(candidate)}</td><td><strong>${candidate.label}</strong><br><span class="tiny muted mono">${candidate.path}</span></td><td><span class="badge ${candidate.baseTone}">${candidate.base}</span></td><td><span class="key">${candidate.captureOk ? "Enter" : "e"}</span> ${candidate.captureOk ? "open Proposal Review" : "open Editor"}</td><td><span class="badge ${modeTone(candidate)}">${modeLabel(candidate)}</span></td></tr>`).join("")}</tbody></table></div></section>`;
    }
    function renderDeck() {
      const variant = variants.find((candidate) => candidate.key === currentVariant);
      const content = currentVariant === "A" ? renderVariantA() : currentVariant === "B" ? renderVariantB() : renderVariantC();
      return `<div class="shell"><div class="eyebrow">Dotman Pull reconciliation · issue 33 prototype</div><h1>Command Deck first. Proposal Review second.</h1><p class="lede">The Command Deck stays compact at any terminal width. <span class="key">Enter</span> opens a separate full-screen Proposal Review in the same TUI. No Proposal details live permanently beside the workset.</p><div class="prototype-note">No files are changed. This is an in-memory behavior prototype.</div>${content}${deckActionButtons()}<div class="help"><strong>Try this:</strong> focus <span class="mono">main:git.gitconfig</span> and press <span class="key">Enter</span>. Proposal Review opens full-screen and shows the Proposal diff. Press <span class="key">r</span> to choose replacement, then <span class="key">m</span> to return to merge. Press <span class="key">Esc</span> to return to the deck.</div><div class="keyboard-strip"><span><span class="key">j</span>/<span class="key">k</span> focus</span><span><span class="key">Enter</span> review</span><span><span class="key">r</span> replacement</span><span><span class="key">m</span> merge</span><span><span class="key">a</span> approve focused</span><span><span class="key">A</span> approve eligible</span><span><span class="key">Apply</span> apply approved</span><span><span class="key">←</span>/<span class="key">→</span> deck layout</span><span><span class="key">?</span> help</span></div><nav class="switcher"><button onclick="cycleVariant(-1)" aria-label="Previous deck layout">←</button><span class="switcher-label"><strong>${variant.key}</strong> — ${variant.name}</span><button onclick="cycleVariant(1)" aria-label="Next deck layout">→</button></nav></div>`;
    }
    function renderReview() {
      const candidate = item(state.reviewId);
      const reviewMode = candidate.noop ? "NO-OP" : !candidate.captureOk ? "EXCEPTIONAL" : candidate.conflict ? "MERGE CONFLICT" : candidate.mode === "replace" ? "REPLACEMENT" : candidate.mode === "edited" ? "EDITED PROPOSAL" : "MERGE";
      const reviewTone = candidate.noop ? "gray" : !candidate.captureOk ? "red" : candidate.conflict ? "red" : candidate.mode === "replace" ? "amber" : "blue";
      const canToggleApproval = approvalAllowed(candidate);
      return `<div class="shell"><section class="panel review-shell"><header class="review-header"><div><div class="eyebrow">Proposal Review · same TUI, full-screen view</div><h2>${candidate.label}</h2><p class="mono">${candidate.path}</p></div><div class="review-header-actions"><span class="badge ${reviewTone}">${reviewMode}</span></div></header><div class="review-banner"><span><strong>Observation:</strong> ${candidate.status}</span><span><strong>Base:</strong> ${candidate.base}</span><span><strong>Capture:</strong> ${candidate.capture}</span><span><strong>Approval:</strong> ${candidate.approved ? "approved" : "pending"}</span></div><div class="review-body"><main class="review-main"><h3>Focused Proposal</h3><div class="proposal-title ${candidate.conflict ? "conflict" : ""}">${reviewMode}</div>${proposalBox(candidate)}<div class="divider"></div><h3>Pull View evidence</h3>${evidence(candidate)}</main><aside class="review-facts"><div class="fact"><div class="fact-label">Sync Base provenance</div><div class="fact-value">${candidate.base}</div><p class="tiny muted" style="margin:6px 0 0">${candidate.baseDetail}</p></div><div class="fact"><div class="fact-label">Materialization</div><div class="fact-value">${candidate.materialized ? "In memory" : candidate.noop ? "No Proposal" : "On Enter"}</div><p class="tiny muted" style="margin:6px 0 0">Review and approval never mutate repository sources. Apply remains the write seam.</p></div><div class="fact"><div class="fact-label">Last action</div><div class="fact-value small">${state.lastAction}</div></div></aside></div><footer class="review-footer"><button class="button primary" onclick="toggleApproval()" ${canToggleApproval ? "" : "disabled"}>${candidate.approved ? "Unapprove" : "Approve"} <span class="key">a</span></button><button class="button" onclick="chooseReplacement()" ${candidate.noop || !candidate.captureOk ? "disabled" : ""}>Replacement <span class="key">r</span></button><button class="button" onclick="chooseMerge()" ${!candidate.canMerge || !candidate.captureOk ? "disabled" : ""}>Merge <span class="key">m</span></button><button class="button" onclick="enterEditor()" ${candidate.noop ? "disabled" : ""}>Proposal Editor <span class="key">e</span></button><button class="button" onclick="toggleEvidence()">${state.showEvidence ? "Hide" : "Show"} evidence <span class="key">v</span></button><button class="button return" onclick="returnDeck()">Command Deck <span class="key">Esc</span></button></footer></section></div>`;
    }
    function renderEditor() {
      const candidate = item(state.editor.id);
      return `<div class="shell"><section class="panel editor-shell"><div class="eyebrow">Proposal Editor · terminal handoff</div><h1 style="font-size:clamp(1.8rem,4vw,2.7rem)">TUI suspended.</h1><p class="lede">The Proposal Editor owns the terminal now. Returning with Save adopts a transactional write set and resumes Proposal Review. Cancel simulates exit 100 and preserves the prior Proposal/status.</p><div class="editor-stage"><strong>${candidate.label}</strong><br>${state.editor.exceptional ? "Exceptional Capture failure — prepare a manual transactional result." : "Edit the Proposal buffer, not the repository working tree."}</div><textarea id="editor-text">${escapeHtml(state.editor.text)}</textarea><div class="command-bar"><button class="button primary" onclick="saveEditor()">Return and adopt edits</button><button class="button" onclick="cancelEditor()">Cancel Editor <span class="key">Esc</span></button></div></section></div>`;
    }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character])); }
    function render() {
      document.querySelector("#app").innerHTML = state.view === "deck" ? renderDeck() : state.view === "review" ? renderReview() : renderEditor();
    }

    document.addEventListener("keydown", (event) => {
      const active = document.activeElement;
      if (active && active.matches("input, textarea, [contenteditable='true']")) {
        if (state.view === "editor" && event.key === "Escape") { event.preventDefault(); cancelEditor(); }
        return;
      }
      if (state.view === "editor") { if (event.key === "Escape") { event.preventDefault(); cancelEditor(); } return; }
      if (state.view === "review") {
        if (event.key === "Escape") { event.preventDefault(); returnDeck(); return; }
        if (event.key === "r") { event.preventDefault(); chooseReplacement(); return; }
        if (event.key === "m") { event.preventDefault(); chooseMerge(); return; }
        if (event.key === "a") { event.preventDefault(); toggleApproval(); return; }
        if (event.key === "e") { event.preventDefault(); enterEditor(); return; }
        if (event.key === "v") { event.preventDefault(); toggleEvidence(); return; }
        return;
      }
      const index = state.items.findIndex((candidate) => candidate.id === state.selectedId);
      if (event.key === "ArrowLeft") { event.preventDefault(); cycleVariant(-1); return; }
      if (event.key === "ArrowRight") { event.preventDefault(); cycleVariant(1); return; }
      if (event.key === "j" || event.key === "ArrowDown") { event.preventDefault(); focusItem(state.items[(index + 1) % state.items.length].id); return; }
      if (event.key === "k" || event.key === "ArrowUp") { event.preventDefault(); focusItem(state.items[(index - 1 + state.items.length) % state.items.length].id); return; }
      if (event.key === "Enter") { event.preventDefault(); openReview(); return; }
      if (event.key === "r") { event.preventDefault(); chooseReplacement(); return; }
      if (event.key === "m") { event.preventDefault(); chooseMerge(); return; }
      if (event.key === "a") { event.preventDefault(); toggleFocusedApproval(); return; }
      if (event.key === "A") { event.preventDefault(); approveEligible(); return; }
      if (event.key === "?") { event.preventDefault(); document.querySelector(".help")?.scrollIntoView({ behavior: "smooth", block: "center" }); }
    });

    render();
  </script>
</body>
</html>
